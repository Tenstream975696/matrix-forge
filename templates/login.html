<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Forge | Log In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #c5c6c7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: #161920;
            border-bottom: 2px solid #00ffcc;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #00ffcc;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-decoration: none;
        }

        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-box {
            background-color: #161920;
            border: 1px solid #242936;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .auth-box h2 {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-align: center;
        }

        .auth-box p {
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: #c5c6c7;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #0d0e12;
            border: 1px solid #242936;
            border-radius: 8px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus {
            border-color: #00ffcc;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #00ffcc;
            color: #0d0e12;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #00e6b8;
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .auth-footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .auth-footer a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">Matrix Forge</a>
    </nav>

    <main class="auth-container">
        <div class="auth-box">
            <h2>System Access</h2>
            <p>Sign in to access your Matrix Forge library and downloads.</p>

            <form action="/login" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="operator@domain.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Log In</button>
            </form>

            <div class="auth-footer">
                Need an account? <a href="signup.html">Create Account</a>
            </div>
        </div>
    </main>

</body>
</html>
